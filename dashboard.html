<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>

    <link rel="stylesheet" href="css/dashboard-style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

   
</head>
<body>

<div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">Company</h2>

        <nav>
            <ul>
                <li><a href="#">Employees</a></li>
                <li><a href="#">Settings</a></li>
                <li><a href="#" id="logoutBtn" class="text text-danger fw-bold">Logout</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">

        <!-- Form Section -->
        <section class="form-section">

            <h1>Employee Management</h1>

            <form class="employee-form" id="employeeForm">

    <div class="form-header">
        <h2>Add New Employee</h2>
    </div>

    <div class="form-row">

        <div class="form-group">
            <label for="name">Employee Name</label>
            <input
                type="text"
                id="name"
                placeholder="John Smith"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="john@company.com"
                required
            >
        </div>

    </div>

    <div class="form-row">

        <div class="form-group">
            <label for="role">Role</label>
            <input
                type="text"
                id="role"
                placeholder="Frontend Developer"
                required
            >
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" required>
                <option value="">Select Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>

    </div>

    <button type="submit" class="add-btn" id="saveBtn">
        + Add New Employee
    </button>
    <p id="message" style="margin-top: 5px;"></p>

</form>


        </section>

        <!-- Table Section -->
        <section class="table-section">
          <div class="mb-4" style="max-width: 500px;">
         <div class="input-group">
         <input 
            type="text" 
            id="searchInput" 
            class="form-control" 
            placeholder="Search employees..." 
        
        >
        <button class="btn btn-info " type="button" id="btnSearch">
            Search
        </button>
    </div>
</div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        
                    </tr>
                </thead>

                <tbody id="dataBody">

                    

                </tbody>
            </table>

        </section>

    </main>

</div>

<script type="module" src="./js/app.js" defer></script>

</body>
</html>
